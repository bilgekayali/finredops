name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile and validate structured inputs
        run: |
          python -m compileall -q src tests
          python -m finredops --help | grep -q "promote-reviewed-report"
          python -m finredops --help | grep -q "verify-release-checksums"
          python -m finredops --help | grep -q "verify-review-trust"
          python -m finredops --help | grep -q "promote-trusted-reviewed-report"
          python -m finredops --help | grep -q "risk-acceptance-signature-request"
          python -m finredops --help | grep -q "approve-trusted-report"
          python -m finredops --help | grep -q "verify-oidc-id-token"
          python -m finredops --help | grep -q "verify-oidc-workflow-bindings"
          python -m finredops --help | grep -q "tenant-policy-change-request"
          python -m finredops --help | grep -q "resolve-change-control"
          python -m finredops --help | grep -q "verify-change-control"
          python -m finredops --help | grep -q "authorize-tenant-route"
          python -m finredops --help | grep -q "verify-tenant-authorization"
          python -m finredops --help | grep -q "authorized-tenant-store-metadata"
          python -m finredops --help | grep -q "postgres-rls-install-sql"
          python -m finredops --help | grep -q "verify-postgres-runtime"
          python -m finredops validate-engagement examples/synthetic_engagement.json
          python -m finredops validate-plan examples/synthetic_ai_plan.json --engagement examples/synthetic_engagement.json
          python -c "import json, pathlib; [json.loads(path.read_text()) for path in pathlib.Path('schemas').glob('*.json')]"
          python -m finredops import-sarif examples/synthetic_sast.sarif.json --output demo-output/finding-intake.json
          python -m finredops validate-intake demo-output/finding-intake.json

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate and verify synthetic demo
        run: |
          python -m finredops demo --output demo-output
          python -m finredops verify-audit demo-output/audit.jsonl
          python -m finredops verify-store demo-output/finredops.db FRX-DEMO-2026-001
          python -m finredops validate-report demo-output/regulatory-report.json
          python -m finredops validate-applicability demo-output/applicability.json
          python -m finredops validate-evidence-manifest demo-output/evidence-manifest.json
          python -m finredops verify-bundle demo-output/audit-dossier.zip
          python -m finredops render-report demo-output/regulatory-report.json --output demo-output/verified-report.md
          python -m finredops report-template --type vendor_source_code_review --output demo-output/vendor-source-template.json
          python -m finredops report-template --type vendor_application_penetration --output demo-output/vendor-app-template.json
          python -m finredops demo-reviewed-report --output-dir demo-output/reviewed
          python -m finredops validate-report demo-output/reviewed/regulatory-report.json

      - name: Enforce simulation-runner import boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finredops/runner.py").read_text(encoding="utf-8"))
          forbidden = {"asyncio", "http", "requests", "socket", "subprocess", "urllib"}
          imports = {
              alias.name.split(".")[0]
              for node in ast.walk(tree)
              if isinstance(node, (ast.Import, ast.ImportFrom))
              for alias in (node.names if isinstance(node, ast.Import) else [ast.alias(node.module or "")])
          }
          unexpected = imports & forbidden
          if unexpected:
              raise SystemExit(f"simulation runner imports forbidden capability: {sorted(unexpected)}")
          PY

      - name: Enforce finding-review no-promotion boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finredops/review.py").read_text(encoding="utf-8"))
          forbidden = {
              "bundle",
              "http",
              "reporting",
              "requests",
              "runner",
              "service",
              "socket",
              "subprocess",
              "urllib",
              "validation",
          }
          imports = {
              (node.module or "").split(".")[0]
              for node in ast.walk(tree)
              if isinstance(node, ast.ImportFrom)
          } | {
              alias.name.split(".")[0]
              for node in ast.walk(tree)
              if isinstance(node, ast.Import)
              for alias in node.names
          }
          unexpected = imports & forbidden
          if unexpected:
              raise SystemExit(
                  f"finding review imports forbidden promotion/execution capability: {sorted(unexpected)}"
              )
          PY

      - name: Enforce OIDC verifier no-network boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finredops/oidc_identity.py").read_text(encoding="utf-8"))
          forbidden = {"http", "http.client", "requests", "socket", "subprocess", "urllib.request"}
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.add(node.module or "")
          unexpected = sorted(
              item for item in imported
              if item in forbidden or any(item.startswith(prefix + ".") for prefix in forbidden)
          )
          if unexpected:
              raise SystemExit(f"OIDC verifier imports forbidden network capability: {unexpected}")
          PY

      - name: Enforce signed change-control verification-only boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for source_path in (
              Path("src/finredops/change_control.py"),
              Path("src/finredops/change_control_cli.py"),
          ):
              tree = ast.parse(source_path.read_text(encoding="utf-8"))
              forbidden = {"asyncio", "http", "jwt", "requests", "socket", "subprocess", "urllib"}
              imported = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name.split(".")[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imported.add((node.module or "").split(".")[0])
              unexpected = sorted(imported & forbidden)
              if unexpected:
                  raise SystemExit(
                      f"change-control verification imports forbidden capability in {source_path}: {unexpected}"
                  )
          tenant_cli = Path("src/finredops/tenant_auth_cli.py").read_text(encoding="utf-8")
          postgres_cli = Path("src/finredops/postgres_cli.py").read_text(encoding="utf-8")
          if "verify_tenant_policy_change_package" not in tenant_cli:
              raise SystemExit("tenant CLI must enforce approved routing-policy change package")
          if "verify_postgres_mapping_change_package" not in postgres_cli:
              raise SystemExit("PostgreSQL CLI must enforce approved service-account mapping package")
          PY

      - name: Enforce tenant authorization no-network and no-token parsing boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finredops/tenant_auth.py").read_text(encoding="utf-8"))
          forbidden = {"http", "requests", "socket", "subprocess", "urllib", "jwt"}
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.add((node.module or "").split(".")[0])
          unexpected = sorted(imported & forbidden)
          if unexpected:
              raise SystemExit(f"tenant authorization imports forbidden capability: {unexpected}")
          PY

      - name: Enforce PostgreSQL tenant source boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/finredops/postgres_rls.py").read_text(encoding="utf-8").lower()
          if "session_user" not in source:
              raise SystemExit("PostgreSQL RLS boundary must derive tenant identity from session_user")
          for forbidden in ("set_config(", "current_setting("):
              if forbidden in source:
                  raise SystemExit(f"PostgreSQL RLS boundary must not trust client-selected tenant GUCs: {forbidden}")
          PY

      - name: Upload verified demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finredops-verified-demo-py${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            demo-output/verified-report.md
            demo-output/audit-dossier.zip
            demo-output/reviewed/finding-intake.json
            demo-output/reviewed/regulatory-report.json
            demo-output/reviewed/regulatory-report.md
            demo-output/reviewed/promotion-manifest.json
            demo-output/reviewed/reviews/*.json

  postgres-rls-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finredops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finredops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINREDOPS_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/finredops
      FINREDOPS_TEST_POSTGRES_RUNTIME_BASE: host=127.0.0.1 port=5432 dbname=finredops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL optional dependency
        run: python -m pip install -e ".[postgres]"

      - name: Run live PostgreSQL RLS integration tests
        run: python -m unittest tests.test_postgres_rls -v

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel with declared runtime dependencies in a clean environment
        run: |
          python -m venv /tmp/finredops-wheel
          /tmp/finredops-wheel/bin/python -m pip install dist/*.whl
          /tmp/finredops-wheel/bin/finredops --help | grep -q "export-examples"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "verify-review-trust"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "approve-trusted-report"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "verify-oidc-id-token"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "verify-oidc-workflow-bindings"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "resolve-change-control"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "verify-change-control"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "authorize-tenant-route"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "verify-tenant-authorization"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "postgres-rls-install-sql"
          /tmp/finredops-wheel/bin/finredops --help | grep -q "verify-postgres-runtime"

      - name: Verify packaged examples and bundled demo
        run: |
          /tmp/finredops-wheel/bin/finredops export-examples --output-dir /tmp/finredops-examples
          /tmp/finredops-wheel/bin/finredops validate-engagement /tmp/finredops-examples/synthetic_engagement.json
          /tmp/finredops-wheel/bin/finredops validate-plan /tmp/finredops-examples/synthetic_ai_plan.json --engagement /tmp/finredops-examples/synthetic_engagement.json
          /tmp/finredops-wheel/bin/finredops demo-reviewed-report --output-dir /tmp/finredops-reviewed
          /tmp/finredops-wheel/bin/finredops validate-report /tmp/finredops-reviewed/regulatory-report.json

      - name: Generate and verify release checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > CHECKSUMS.sha256
          cd ..
          /tmp/finredops-wheel/bin/finredops verify-release-checksums --manifest dist/CHECKSUMS.sha256 --directory dist

      - name: Upload package smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finredops-package-smoke
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/CHECKSUMS.sha256
