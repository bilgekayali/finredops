name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile and validate structured inputs
        run: |
          python -m compileall -q src tests
          python -m finredops --help | grep -q "promote-reviewed-report"
          python -m finredops --help | grep -q "verify-release-checksums"
          python -m finredops validate-engagement examples/synthetic_engagement.json
          python -m finredops validate-plan examples/synthetic_ai_plan.json --engagement examples/synthetic_engagement.json
          python -c "import json, pathlib; [json.loads(path.read_text()) for path in pathlib.Path('schemas').glob('*.json')]"
          python -m finredops import-sarif examples/synthetic_sast.sarif.json --output demo-output/finding-intake.json
          python -m finredops validate-intake demo-output/finding-intake.json

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate and verify synthetic demo
        run: |
          python -m finredops demo --output demo-output
          python -m finredops verify-audit demo-output/audit.jsonl
          python -m finredops verify-store demo-output/finredops.db FRX-DEMO-2026-001
          python -m finredops validate-report demo-output/regulatory-report.json
          python -m finredops validate-applicability demo-output/applicability.json
          python -m finredops validate-evidence-manifest demo-output/evidence-manifest.json
          python -m finredops verify-bundle demo-output/audit-dossier.zip
          python -m finredops render-report demo-output/regulatory-report.json --output demo-output/verified-report.md
          python -m finredops report-template --type vendor_source_code_review --output demo-output/vendor-source-template.json
          python -m finredops report-template --type vendor_application_penetration --output demo-output/vendor-app-template.json
          python -m finredops demo-reviewed-report --output-dir demo-output/reviewed
          python -m finredops validate-report demo-output/reviewed/regulatory-report.json

      - name: Enforce simulation-runner import boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finredops/runner.py").read_text(encoding="utf-8"))
          forbidden = {"asyncio", "http", "requests", "socket", "subprocess", "urllib"}
          imports = {
              alias.name.split(".")[0]
              for node in ast.walk(tree)
              if isinstance(node, (ast.Import, ast.ImportFrom))
              for alias in (node.names if isinstance(node, ast.Import) else [ast.alias(node.module or "")])
          }
          unexpected = imports & forbidden
          if unexpected:
              raise SystemExit(f"simulation runner imports forbidden capability: {sorted(unexpected)}")
          PY

      - name: Enforce finding-review no-promotion boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("src/finredops/review.py").read_text(encoding="utf-8"))
          forbidden = {
              "bundle",
              "http",
              "reporting",
              "requests",
              "runner",
              "service",
              "socket",
              "subprocess",
              "urllib",
              "validation",
          }
          imports = {
              (node.module or "").split(".")[0]
              for node in ast.walk(tree)
              if isinstance(node, ast.ImportFrom)
          } | {
              alias.name.split(".")[0]
              for node in ast.walk(tree)
              if isinstance(node, ast.Import)
              for alias in node.names
          }
          unexpected = imports & forbidden
          if unexpected:
              raise SystemExit(
                  f"finding review imports forbidden promotion/execution capability: {sorted(unexpected)}"
              )
          PY

      - name: Upload verified demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finredops-verified-demo-py${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            demo-output/verified-report.md
            demo-output/audit-dossier.zip
            demo-output/reviewed/finding-intake.json
            demo-output/reviewed/regulatory-report.json
            demo-output/reviewed/regulatory-report.md
            demo-output/reviewed/promotion-manifest.json
            demo-output/reviewed/reviews/*.json

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/finredops-wheel
          /tmp/finredops-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/finredops-wheel/bin/finredops --help | grep -q "export-examples"

      - name: Verify packaged examples and bundled demo
        run: |
          /tmp/finredops-wheel/bin/finredops export-examples --output-dir /tmp/finredops-examples
          /tmp/finredops-wheel/bin/finredops validate-engagement /tmp/finredops-examples/synthetic_engagement.json
          /tmp/finredops-wheel/bin/finredops validate-plan /tmp/finredops-examples/synthetic_ai_plan.json --engagement /tmp/finredops-examples/synthetic_engagement.json
          /tmp/finredops-wheel/bin/finredops demo-reviewed-report --output-dir /tmp/finredops-reviewed
          /tmp/finredops-wheel/bin/finredops validate-report /tmp/finredops-reviewed/regulatory-report.json

      - name: Generate and verify release checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > CHECKSUMS.sha256
          cd ..
          /tmp/finredops-wheel/bin/finredops verify-release-checksums --manifest dist/CHECKSUMS.sha256 --directory dist

      - name: Upload package smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finredops-package-smoke
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/CHECKSUMS.sha256
