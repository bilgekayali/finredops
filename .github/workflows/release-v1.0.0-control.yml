name: Release v1.0.0 Control

on:
  push:
    branches:
      - "release/v1.0.0-control"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-v1.0.0-control
  cancel-in-progress: false

env:
  TARGET_SHA: cb2c8f82fc55fc873ec77514217271ad6569a6d6
  RELEASE_TAG: v1.0.0

jobs:
  publish-pinned-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable release target and repository state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${CURRENT_MAIN}" = "${TARGET_SHA}" || {
            echo "main moved: expected ${TARGET_SHA}, found ${CURRENT_MAIN}" >&2
            exit 1
          }
          VERIFIED="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}" --jq '.commit.verification.verified')"
          test "${VERIFIED}" = "true" || {
            echo "Target commit is not GitHub-verified." >&2
            exit 1
          }
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing duplicate publication." >&2
            exit 1
          fi
          if EXISTING_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            test "${EXISTING_TAG_SHA}" = "${TARGET_SHA}" || {
              echo "Existing tag ${RELEASE_TAG} points to ${EXISTING_TAG_SHA}, not ${TARGET_SHA}." >&2
              exit 1
            }
            echo "Existing tag ${RELEASE_TAG} already points to the pinned target; publication may resume."
          else
            echo "Tag ${RELEASE_TAG} is absent and will be created only after build/provenance gates pass."
          fi

      - name: Check out exact v1.0.0 target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify checked-out target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release version and v1 contract
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as source:
              print(tomllib.load(source)['project']['version'])
          PY
          )"
          test "${PACKAGE_VERSION}" = "1.0.0"
          test "${RELEASE_TAG#v}" = "${PACKAGE_VERSION}"
          python -m unittest tests.test_v1_release_gate -v

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test installed wheel and stable v1 CLI contract
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/finredops-release
          /tmp/finredops-release/bin/python -m pip install dist/*.whl
          /tmp/finredops-release/bin/python - <<'PY'
          import finredops
          from finredops.v1_release import v1_release_manifest
          manifest = v1_release_manifest()
          assert finredops.__version__ == manifest['release_version']
          assert manifest['release_version'] == '1.0.0'
          PY
          HELP="$(/tmp/finredops-release/bin/finredops --help)"
          while IFS= read -r command; do
            grep -q -- "${command}" <<<"${HELP}" || {
              echo "Stable v1 CLI command missing from installed wheel: ${command}" >&2
              exit 1
            }
          done < <(/tmp/finredops-release/bin/python - <<'PY'
          from finredops.v1_release import STABLE_CLI_COMMANDS
          print('\n'.join(STABLE_CLI_COMMANDS))
          PY
          )
          /tmp/finredops-release/bin/finredops export-examples --output-dir /tmp/finredops-release-examples
          /tmp/finredops-release/bin/finredops validate-engagement /tmp/finredops-release-examples/synthetic_engagement.json
          /tmp/finredops-release/bin/finredops validate-plan /tmp/finredops-release-examples/synthetic_ai_plan.json --engagement /tmp/finredops-release-examples/synthetic_engagement.json
          /tmp/finredops-release/bin/finredops demo-reviewed-report --output-dir /tmp/finredops-release-reviewed
          /tmp/finredops-release/bin/finredops validate-report /tmp/finredops-release-reviewed/regulatory-report.json

      - name: Generate v1 release and deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          /tmp/finredops-release/bin/python - <<'PY'
          import json
          from pathlib import Path
          from finredops.reference_deployment import validate_reference_deployment
          from finredops.v1_release import v1_release_manifest

          dist = Path('dist')
          dist.joinpath('v1-release-contract.json').write_text(
              json.dumps(v1_release_manifest(), indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          profile = json.loads(Path('deploy/reference/production-reference.json').read_text(encoding='utf-8'))
          validated = validate_reference_deployment(profile)
          dist.joinpath('production-reference.json').write_text(
              json.dumps(validated, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Generate and verify SHA-256 checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz *.json > CHECKSUMS.sha256
          cd ..
          /tmp/finredops-release/bin/finredops verify-release-checksums --manifest dist/CHECKSUMS.sha256 --directory dist

      - name: Generate GitHub/Sigstore build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Upload immutable build artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: finredops-release-${{ env.TARGET_SHA }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.json
            dist/CHECKSUMS.sha256

      - name: Create exact v1.0.0 tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${TARGET_SHA}" >/dev/null
          fi
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "${TAG_SHA}" = "${TARGET_SHA}"
          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "FinRedOps ${RELEASE_TAG}"

      - name: Verify published release target and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "${TAG_SHA}" = "${TARGET_SHA}"
          gh release view "${RELEASE_TAG}" --json tagName,name,isDraft,isPrerelease --jq \
            'select(.tagName == "v1.0.0" and .name == "FinRedOps v1.0.0" and .isDraft == false and .isPrerelease == false)' >/dev/null
          ASSET_COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')"
          test "${ASSET_COUNT}" -ge 5
          echo "FinRedOps ${RELEASE_TAG} published from ${TARGET_SHA} with ${ASSET_COUNT} assets."
