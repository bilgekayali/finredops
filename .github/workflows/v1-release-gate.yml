name: V1 Release Gate

on:
  push:
    branches:
      - main
      - "agent/v1.0.0-*"
  pull_request:

permissions:
  contents: read

jobs:
  v1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run v1 release-gate regression suite
        run: |
          python -m unittest tests.test_v1_release_gate -v
          python -m unittest tests.test_release_candidate_hardening -v
          python -m unittest tests.test_security_artifact_compatibility -v
      - name: Validate all JSON schema documents
        run: python -c "import json, pathlib; [json.loads(path.read_text()) for path in pathlib.Path('schemas').glob('*.json')]"
      - name: Validate production reference deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from finredops.reference_deployment import validate_reference_deployment
          from finredops.v1_release import STABLE_CLI_COMMANDS, v1_release_manifest

          profile = json.loads(Path('deploy/reference/production-reference.json').read_text(encoding='utf-8'))
          validated = validate_reference_deployment(profile)
          manifest = v1_release_manifest()
          assert manifest['release_version'] == '1.0.0'
          assert validated['release_version'] == '1.0.0'
          assert len(STABLE_CLI_COMMANDS) == len(set(STABLE_CLI_COMMANDS))
          print(validated['deployment_digest'])
          PY
      - name: Verify stable CLI commands are exposed
        shell: bash
        run: |
          set -euo pipefail
          HELP="$(finredops --help)"
          while IFS= read -r command; do
            grep -q -- "${command}" <<<"${HELP}" || {
              echo "stable command missing: ${command}" >&2
              exit 1
            }
          done < <(python - <<'PY'
          from finredops.v1_release import STABLE_CLI_COMMANDS
          print('\n'.join(STABLE_CLI_COMMANDS))
          PY
          )

  reference-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finredops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finredops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINREDOPS_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/finredops
      FINREDOPS_TEST_POSTGRES_RUNTIME_BASE: host=127.0.0.1 port=5432 dbname=finredops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL integration dependencies
        run: python -m pip install -e ".[postgres]"
      - name: Exercise production-reference RLS boundary
        run: python -m unittest tests.test_postgres_rls -v
