name: Assurance Completeness

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  assurance-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Run assurance regression tests
        run: python -m unittest tests.test_assurance_completeness tests.test_asvs_coverage tests.test_assurance_linkage -v
      - name: Enforce version pins and offline boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from finredops.asvs_coverage import ASVS_VERSION
          from finredops.cvss40 import CVSS40_VERSION
          from finredops.supply_chain import CYCLONEDX_SPEC_VERSION

          assert CYCLONEDX_SPEC_VERSION == "1.7"
          assert CVSS40_VERSION == "4.0"
          assert ASVS_VERSION == "5.0.0"

          forbidden = {"socket", "urllib", "http", "requests", "subprocess"}
          for name in ("cvss40.py", "supply_chain.py", "asvs_coverage.py"):
              path = Path("src/finredops") / name
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              imports = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.update(alias.name.split(".")[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.add(node.module.split(".")[0])
              unexpected = sorted(imports & forbidden)
              if unexpected:
                  raise SystemExit(f"{path} imports forbidden capabilities: {unexpected}")

          supply_source = Path("src/finredops/supply_chain.py").read_text(encoding="utf-8")
          for module in ("review", "reporting", "promotion", "bundle"):
              if f"finredops.{module}" in supply_source or f"from .{module}" in supply_source:
                  raise SystemExit(f"supply-chain intake must not promote into {module}")
          PY
