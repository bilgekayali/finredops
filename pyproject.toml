[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finredops"
version = "0.8.3"
description = "Governance-first AI-assisted security testing orchestration for regulated financial institutions"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Bilge Kayalı" },
]
license = { file = "LICENSE" }
keywords = [
  "ai-security",
  "dora",
  "envelope-encryption",
  "financial-services",
  "hsm",
  "iso-27001",
  "kms",
  "multi-tenant",
  "penetration-testing",
  "postgresql",
  "regtech",
  "red-team",
  "row-level-security",
  "sarif",
  "tenant-authorization",
  "tse-13638",
  "tiber-eu",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=49,<50",
  "PyJWT[crypto]>=2.13,<3",
]

[project.optional-dependencies]
aws-kms = [
  "boto3>=1.35,<2",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/bilgekayali/finredops"
Repository = "https://github.com/bilgekayali/finredops"
Issues = "https://github.com/bilgekayali/finredops/issues"

[project.scripts]
finredops = "finredops.entrypoint:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finredops.examples" = ["*.json"]
